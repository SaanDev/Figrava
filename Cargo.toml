[workspace]
resolver = "2"
members = [
    "crates/scientific-core",
    "crates/plot-model",
    "crates/data-engine",
    "crates/analysis-engine",
    "crates/project-engine",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Scientific Plot Studio Contributors"]
repository = "https://github.com/scientific-plot-studio/scientific-plot-studio"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
csv = "1.3.1"
nalgebra = { version = "0.33.2", features = ["serde-serialize"] }
statrs = "0.18.0"
rustfft = "6.4.1"
calamine = "0.37.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rayon = "1.10.0"
chrono = { version = "0.4.40", features = ["serde"] }
tempfile = "3.19.1"
